<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roue de la Fortune</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Roue de la Fortune</h1>
    <div id="main-container">
        <div id="wheel-container">
            <canvas id="wheel" width="400" height="400"></canvas>
            <button id="spin-button">Lancer</button>
        </div>
        <div id="options-container">
            <h2>Options</h2>
            <div id="options-list"></div>
            <input type="text" id="new-option" placeholder="Nouvelle option">
            <button id="add-option-button">Ajouter</button>
        </div>
    </div>

    <div id="popup-container" class="hidden">
        <div id="popup">
            <h2>Félicitations !</h2>
            <p>Vous avez gagné : <span id="result"></span></p>
            <button id="close-popup">Fermer</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
